apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: manoj
  region: us-east-1
  version: "1.35"

availabilityZones: ["us-east-1a", "us-east-1b"]

vpc:
  cidr: 192.168.0.0/16

managedNodeGroups:
  - name: public-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 6
    volumeSize: 20
    privateNetworking: false        # public subnets, nodes get public IPs
    iam:
      withAddonPolicies:
        autoScaler: true            # attaches Cluster Autoscaler permissions to the node role
    tags:
      k8s.io/cluster-autoscaler/enabled: "true"
      k8s.io/cluster-autoscaler/manoj: "owned"
