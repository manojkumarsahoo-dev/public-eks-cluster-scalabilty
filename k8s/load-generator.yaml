apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args: ["while true; do wget -q -O- http://nginx > /dev/null; done"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
